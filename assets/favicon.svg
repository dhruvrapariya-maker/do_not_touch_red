<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="playerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="60%" stop-color="#ff003c"/>
      <stop offset="100%" stop-color="#ff0000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#080812"/>
  <circle cx="32" cy="32" r="28" stroke="#ff003c" stroke-width="2" stroke-opacity="0.3" fill="none"/>
  <!-- Hazard triangle warning -->
  <circle cx="48" cy="20" r="10" fill="url(#redGlow)"/>
  <circle cx="48" cy="20" r="6" fill="#ff003c"/>
  <circle cx="16" cy="48" r="12" fill="url(#redGlow)"/>
  <circle cx="16" cy="48" r="7" fill="#ff003c"/>
  <!-- Glowing player ball -->
  <circle cx="32" cy="30" r="14" fill="url(#playerGlow)"/>
  <circle cx="32" cy="30" r="7" fill="#00f3ff"/>
  <circle cx="30" cy="28" r="2.5" fill="#ffffff"/>
</svg>